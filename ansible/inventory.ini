# Static and safe to commit -- no secrets or environment-specific values.
# scripts/ansible-provision.sh always forwards an IAP tunnel to this fixed
# local port before running the playbook, regardless of which GCP
# project/instance it's actually pointed at.
#
# StrictHostKeyChecking is off because the authenticated, encrypted
# channel here is the IAP tunnel itself (gated by IAM) -- the SSH host
# key of "127.0.0.1:2222" is meaningless across separate tunnel sessions
# to begin with. `gcloud compute ssh` special-cases this same scenario.
[dev_vps]
ai-dev-vps ansible_host=127.0.0.1 ansible_port=2222 ansible_user=mike ansible_ssh_private_key_file=~/.ssh/google_compute_engine ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
